version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ratelimit-api-postgres
    environment:
      POSTGRES_USER: apiuser
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: ratelimit_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apiuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ratelimit-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - api-network

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ratelimit-api-service
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: apiuser
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: ratelimit_api
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRES_IN: 24h
      RATE_LIMIT_FREE_TIER: 60
      RATE_LIMIT_PAID_TIER: 600
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules
    networks:
      - api-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  api-network:
    driver: bridge
